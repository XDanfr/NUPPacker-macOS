name: Build & Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --group build
      - name: PyInstaller
        run: >
          uv run pyinstaller packaging/launcher.py
          --name nuppacker --windowed --onedir --noconfirm
          --paths src --collect-submodules nuppacker
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist/nuppacker -DestinationPath nuppacker-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: nuppacker-windows-portable.zip

  linux:
    runs-on: ubuntu-22.04 # older glibc = AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: System libs for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3
      - run: uv sync --group build
      - name: PyInstaller
        run: >
          uv run pyinstaller packaging/launcher.py
          --name nuppacker --windowed --onedir --noconfirm
          --paths src --collect-submodules nuppacker
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/nuppacker AppDir/usr/bin/nuppacker
          cp packaging/nuppacker.png AppDir/nuppacker.png
          cat > AppDir/nuppacker.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NUP Packer
          Exec=nuppacker
          Icon=nuppacker
          Categories=Utility;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/nuppacker/nuppacker" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Build AppImage
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir NUP-Packer-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: NUP-Packer-x86_64.AppImage

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --group build
      - name: Build DMG
        run: bash packaging/build-macos-dmg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/NUP-Packer-macos-${{ matrix.arch }}.dmg

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute tag
        id: v
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag=v${VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NUP Packer ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/nuppacker-windows-portable.zip
            artifacts/NUP-Packer-x86_64.AppImage
            artifacts/NUP-Packer-macos-x86_64.dmg
            artifacts/NUP-Packer-macos-arm64.dmg
